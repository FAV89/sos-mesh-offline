name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Clean AndroidManifest
      run: |
        mkdir -p app/src/main
        python3 -c '
        c = "android:"
        xml = f"""<?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:{c[:-1]}="http://android.com">
            <uses-permission {c}name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission {c}name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission {c}name="android.permission.BLUETOOTH" />
            <uses-permission {c}name="android.permission.BLUETOOTH_ADMIN" />
            <uses-permission {c}name="android.permission.BLUETOOTH_ADVERTISE" />
            <uses-permission {c}name="android.permission.BLUETOOTH_SCAN" {c}usesPermissionFlags="neverForLocation" />
            <uses-permission {c}name="android.permission.BLUETOOTH_CONNECT" />
            <uses-permission {c}name="android.permission.INTERNET" />
            <uses-permission {c}name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-feature {c}name="android.hardware.bluetooth_le" {c}required="true" />
            <uses-feature {c}name="android.hardware.location.gps" {c}required="true" />
            <application {c}allowBackup="true" {c}label="SOS Mesh Offline" {c}supportsRtl="true" {c}theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity {c}name=".MainActivity" {c}exported="true" {c}screenOrientation="portrait">
                    <intent-filter>
                        <action {c}name="android.intent.action.MAIN" />
                        <category {c}name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>"""
        open("app/src/main/AndroidManifest.xml", "w").write(xml)
        '

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x gradlew || true
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SOS-Mesh-App
        path: app/build/outputs/apk/debug/app-debug.apk
