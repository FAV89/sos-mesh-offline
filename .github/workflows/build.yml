name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Clean AndroidManifest
      run: |
        mkdir -p app/src/main
        printf '<?xml version="1.0" encoding="utf-8"?>\n' > app/src/main/AndroidManifest.xml
        printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' >> app/src/main/AndroidManifest.xml
        printf '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n' >> app/src/main/AndroidManifest.xml
        printf '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n' >> app/src/main/AndroidManifest.xml
        printf '    <uses-permission android:name="android.permission.BLUETOOTH" />\n' >> app/src/main/AndroidManifest.xml
        printf '    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n' >> app/src/main/AndroidManifest.xml
        printf '    <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\n' >> app/src/main/AndroidManifest.xml
        printf '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n' >> app/src/main/AndroidManifest.xml
        printf '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n' >> app/src/main/AndroidManifest.xml
        printf '    <uses-permission android:name="android.permission.INTERNET" />\n' >> app/src/main/AndroidManifest.xml
        printf '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n' >> app/src/main/AndroidManifest.xml
        printf '    <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />\n' >> app/src/main/AndroidManifest.xml
        printf '    <uses-feature android:name="android.hardware.location.gps" android:required="true" />\n' >> app/src/main/AndroidManifest.xml
        printf '    <application android:allowBackup="true" android:label="SOS Mesh Offline" android:supportsRtl="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">\n' >> app/src/main/AndroidManifest.xml
        printf '        <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">\n' >> app/src/main/AndroidManifest.xml
        printf '            <intent-filter>\n' >> app/src/main/AndroidManifest.xml
        printf '                <action android:name="android.intent.action.MAIN" />\n' >> app/src/main/AndroidManifest.xml
        printf '                <category android:name="android.intent.category.LAUNCHER" />\n' >> app/src/main/AndroidManifest.xml
        printf '            </intent-filter>\n' >> app/src/main/AndroidManifest.xml
        printf '        </activity>\n' >> app/src/main/AndroidManifest.xml
        printf '    </application>\n' >> app/src/main/AndroidManifest.xml
        printf '</manifest>\n' >> app/src/main/AndroidManifest.xml

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x gradlew || true
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug

        - name: Upload APK
          uses: actions/upload-artifact@v4
          with:
        name: SOS-Mesh-App
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish APK to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: apk-${{ github.run_number }}
        name: Build #${{ github.run_number }} (SOS Mesh Offline)
        files: app/build/outputs/apk/debug/app-debug.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
