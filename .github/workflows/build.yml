name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x gradlew || true
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SOS-Mesh-App
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish APK to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: apk-${{ github.run_number }}
        name: Build #${{ github.run_number }} (SOS Mesh Offline)
        body: |
          **Pagina web (fără instalare):** https://fav89.github.io/sos-mesh-offline/
          **Aplicația Android:** descarcă `app-debug.apk` de mai jos și instalează-l (permite surse necunoscute).
          Pagina web e atașată și ca `index.html`, pentru uz local.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          index.html
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
